config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  # Local-only working data (gitignored), not part of the package
  "benchmark/**",
  "probe_analysis/**",
  "refs*/**",
  "test_output/**",
]

test_patterns = [
  "tests/**",
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"
version = "0.17.0"  # keep in step with the CI lint job
drivers = [
  "lint",
]

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

# pytest is built on plain asserts, and the tests write scratch files to /tmp.
[[triage]]
match.rules = ["bandit:B101", "bandit:B108"]
match.file_patterns = ["tests/**"]
set.ignored = true

# eFISHent drives external bioinformatics tools (bowtie/bowtie2, BLAST+,
# jellyfish, Fold, gffread) by design. Every call passes an argument list,
# never shell=True, and the tools are resolved from PATH, which the installer
# sets up. These three subprocess checks therefore flag the tool's purpose.
[[triage]]
match.rules = ["bandit:B404", "bandit:B603", "bandit:B607"]
set.ignored = true

# Pre-built genome indices are versioned on the Hugging Face Hub and follow
# the dataset's main branch on purpose, so new or rebuilt indices reach users
# without a code release. bandit only accepts a commit hash as revision.
[[triage]]
match.rules = ["bandit:B615"]
match.file_patterns = ["eFISHent/prebuilt.py"]
set.ignored = true

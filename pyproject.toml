[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eFISHent"
version = "0.0.19"
description = "RNA FISH oligos/probes design tool."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Bastian Eichenberger", email = "bastian@eichenbergers.ch" }
]
keywords = ["biomedical", "bioinformatics", "RNA probe design"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Utilities",
]
dependencies = [
    "biopython",
    "huggingface_hub",
    "luigi",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow>=18.0.0",
    "pyomo",
    "pysam",
    "rich>=13.0.0",
    "rich-argparse>=1.4.0",
]

[dependency-groups]
dev = [
    "deptry==0.25.1",
    "pytest>=7.0",
    "pytest-cov>=7.1.0",
    "vulture==2.16",
]

[project.urls]
Homepage = "https://github.com/bbquercus/efishent/"
Documentation = "https://github.com/BBQuercus/efishent/wiki"
Changelog = "https://github.com/BBQuercus/efishent/releases"
"Issue Tracker" = "https://github.com/bbquercus/efishent/issues"

[project.scripts]
efishent = "eFISHent.cli:main"
eFISHent = "eFISHent.cli:main"

[tool.setuptools.packages.find]
include = ["eFISHent*"]

[tool.setuptools.package-data]
eFISHent = ["Fold_osx", "Fold_linux", "data_tables/*", "data/*", "py.typed"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Explicit rule set so ruff's default selection can't drift between releases.
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "C4", "N"]
ignore = [
    "N999",  # package is named eFISHent
    "B905",  # zip(strict=...) would change behaviour on uneven inputs
]

[tool.ruff.lint.per-file-ignores]
"eFISHent/cli.py" = ["E402", "F401"]
"vulture_whitelist.py" = ["B018", "F821"]  # bare names by design

# Dead-code check (CI job "static-analysis"); run locally with `scripts/lint_dead.sh`.
# Known false positives live in vulture_whitelist.py, one reason per entry.
[tool.vulture]
paths = ["eFISHent", "tests", "vulture_whitelist.py"]
min_confidence = 60
ignore_decorators = ["@pytest.fixture"]
# requires: luigi task hook; mock_*: arguments injected by @patch; kw: catch-all in lambdas.
ignore_names = ["requires", "mock_*", "kw"]

# Unused / missing dependency check, same CI job.
[tool.deptry]
known_first_party = ["eFISHent"]

[tool.deptry.per_rule_ignores]
# packaging comes in via other deps today; eFISHent/updates.py imports it. Baseline – add it to
# [project.dependencies] in a later release.
DEP003 = ["packaging"]

[tool.mypy]
mypy_path = "eFISHent"
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
no_implicit_reexport = true
